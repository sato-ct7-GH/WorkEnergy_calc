<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕事とエネルギー 計算問題</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pri2:#dbeafe;--ok:#16a34a;--okbg:#dcfce7;--ng:#dc2626;--ngbg:#fee2e2;--sym:#7c3aed;--num:#0e7490}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:17px;line-height:1.7}
header{position:sticky;top:0;z-index:10;background:#1e3a8a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
.who{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:9}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;color:var(--ink);min-height:44px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
main{max-width:880px;margin:0 auto;padding:16px 12px 80px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.btn{border:none;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:600;cursor:pointer;min-height:50px}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:disabled{background:#93c5fd;cursor:default}
.btn.sec{background:#eef2f7;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;font-size:14px;color:var(--sub);gap:4px}
input,select{font-size:17px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;min-height:46px;background:#fff;color:var(--ink)}
.modes{display:flex;gap:8px;margin-bottom:14px}
.mode{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;cursor:pointer;min-height:50px}
.mode.on{border-color:var(--pri);background:var(--pri2);font-weight:700}
.mem{display:grid;grid-template-columns:52px 110px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.mem span{color:var(--sub);font-size:14px}
.msg{padding:10px 14px;border-radius:10px;margin-top:10px;font-size:15px}
.msg.ng{background:var(--ngbg);color:#991b1b}.msg.ok{background:var(--okbg);color:#166534}.msg.info{background:#eef2ff;color:#3730a3}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pno{font-weight:800;font-size:19px}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;color:#fff;font-weight:700}
.badge.文字{background:var(--sym)}.badge.数値{background:var(--num)}
.ptitle{color:var(--sub);font-size:15px}
.ptext{margin:4px 0 10px}
.fig{display:block;max-width:330px;width:100%;margin:6px auto 12px;color:#334155}
.sub{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.sq{font-weight:600;margin-bottom:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}.mem{grid-template-columns:40px 90px 1fr}}
.ch{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:17px;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink)}
.ch b{flex:0 0 28px;height:28px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:14px}
.ch.ng{border-color:var(--ng);background:var(--ngbg);opacity:.75;cursor:default}
.ch.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.ch:disabled{cursor:default}
.fb{margin-top:8px;font-size:15px}
.fb .res{font-weight:800}.fb .res.ok{color:var(--ok)}.fb .res.ng{color:var(--ng)}
.exp{background:#f8fafc;border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;margin-top:6px}
.progress{font-size:15px;color:var(--sub)}
.score{font-size:30px;font-weight:800;color:var(--pri)}
.intro li{margin-bottom:4px}
</style>

<body>
<header><h1>仕事とエネルギー 計算問題</h1><button class="who" id="who" onclick="editStudent()"></button></header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<script>
// ==== 問題生成 ====
const g = 9.8;
const R = String.raw;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const M = s => '\\(' + s + '\\)';
const S3 = 1.73;

// 有効数字2桁の表記（教科書の書き方：35，4.9，0.15，2.9×10^2，5.0×10^-2）
function fmt(x) {
  if (Math.abs(x) < 1e-9) return '0';
  const sg = x < 0 ? '-' : '';
  const a = Math.abs(x);
  let e = Math.floor(Math.log10(a) + 1e-12);
  let m = Math.round(a / Math.pow(10, e) * 10 + 1e-9) / 10;
  if (m >= 10) { m = 1; e++; }
  if (e >= 2 || e <= -2) return sg + m.toFixed(1) + '\\times10^{' + e + '}';
  const v = m * Math.pow(10, e);
  return sg + v.toFixed(Math.max(0, 1 - e));
}
// 問題文中の与えられた値
function V(x) {
  if (Number.isInteger(x) && Math.abs(x) >= 100) return String(x);
  const f = fmt(x);
  return f.includes('times') ? M(f) : f.replace('-', '−');
}
const N = (x, u) => M(fmt(x) + (u ? '\\ \\mathrm{' + u + '}' : ''));

function mk(q, ans, ds, exp) {
  const all = shuffle([ans, ...ds]);
  return { q, ch: all, a: all.indexOf(ans), exp };
}
// 数値の小問：答えと誤答候補から重複しない4択をつくる
function numSub(q, ans, unit, cands, exp) {
  const used = new Set([fmt(ans)]), ds = [];
  const pool = cands.concat([2, 0.5, 1.5, 3, 0.25, 4, 10, 0.1, -1].map(k => ans * k), [1, 2, 5, 10]);
  for (const c of pool) {
    if (!isFinite(c)) continue;
    const k = fmt(c);
    if (used.has(k)) continue;
    used.add(k); ds.push(c);
    if (ds.length === 3) break;
  }
  return mk(q, N(ans, unit), ds.map(d => N(d, unit)), exp);
}
const symSub = (q, ans, ds, exp) => mk(q, M(ans), ds.map(M), exp);

// ==== 図 ====
function arr(x1, y1, x2, y2, w = 2) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 10;
  const p = t => `${(x2 - L * Math.cos(a + t)).toFixed(1)},${(y2 - L * Math.sin(a + t)).toFixed(1)}`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="${w}"/><polygon points="${x2},${y2} ${p(0.4)} ${p(-0.4)}" fill="currentColor"/>`;
}
const svg = (h, body) => `<svg class="fig" viewBox="0 0 320 ${h}" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" font-size="14">${body}</svg>`;
const tx = (x, y, s, anc = 'middle') => `<text x="${x}" y="${y}" fill="currentColor" stroke="none" text-anchor="${anc}">${s}</text>`;
const ground = (y, x1 = 15, x2 = 305) => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>` + Array.from({ length: Math.floor((x2 - x1) / 14) }, (_, i) => `<line x1="${x1 + 8 + i * 14}" y1="${y}" x2="${x1 + i * 14}" y2="${y + 8}" stroke-width="1"/>`).join('');
function zig(x1, y1, x2, y2, n = 8, amp = 8) {
  const dx = (x2 - x1) / (n * 2), dy = (y2 - y1) / (n * 2), L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
  let d = `M${x1},${y1}`;
  for (let i = 1; i < n * 2; i++) { const s = (i % 2 ? 1 : -1) * amp; d += ` L${(x1 + dx * i + nx * s).toFixed(1)},${(y1 + dy * i + ny * s).toFixed(1)}`; }
  return `<path d="${d} L${x2},${y2}"/>`;
}
function figForceAngle(lbl) {
  const t = 30 * Math.PI / 180, cx = 150, cy = 100;
  return svg(150, ground(125) + `<rect x="115" y="80" width="70" height="45"/>` +
    arr(cx, cy, cx + 105 * Math.cos(t), cy - 105 * Math.sin(t), 3) +
    `<line x1="${cx}" y1="${cy}" x2="270" y2="${cy}" stroke-dasharray="5 4" stroke-width="1.5"/>` +
    `<path d="M${cx + 45},${cy} A45,45 0 0 0 ${(cx + 45 * Math.cos(t)).toFixed(1)},${(cy - 45 * Math.sin(t)).toFixed(1)}" stroke-width="1.5"/>` +
    tx(cx + 62, cy - 10, lbl) + tx(cx + 112, cy - 58, 'F'));
}
function figIncline(lbl, arrow = '') {
  const t = Math.PI / 6, x0 = 30, y0 = 150, bl = 250, h = bl * Math.tan(t);
  const cx = x0 + bl * 0.5, cy = y0 - bl * 0.5 * Math.tan(t);
  let a = '';
  if (arrow) {
    const ux = Math.cos(t), uy = -Math.sin(t), sx = cx + ux * 22 - uy * 0, sy = cy + uy * 22;
    a = arr(sx + 14 * Math.sin(t), sy - 14 * Math.cos(t), sx + ux * 60 + 14 * Math.sin(t), sy + uy * 60 - 14 * Math.cos(t), 3) + tx(sx + ux * 60 + 10, sy + uy * 60 - 30, arrow);
  }
  return svg(170, `<polygon points="${x0},${y0} ${x0 + bl},${y0} ${x0 + bl},${(y0 - h).toFixed(1)}"/>` +
    `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(-30)"><rect x="-22" y="-30" width="44" height="30"/></g>` +
    `<path d="M${x0 + 50},${y0} A50,50 0 0 0 ${(x0 + 50 * Math.cos(t)).toFixed(1)},${(y0 - 50 * Math.sin(t)).toFixed(1)}" stroke-width="1.5"/>` + tx(x0 + 66, y0 - 8, lbl) + a);
}
function figPulley() {
  return svg(185, `<line x1="60" y1="10" x2="280" y2="10" stroke-width="3"/>` +
    `<line x1="220" y1="10" x2="220" y2="45"/><circle cx="220" cy="45" r="16"/>` +
    `<line x1="134" y1="10" x2="134" y2="115"/><circle cx="150" cy="115" r="16"/>` +
    `<line x1="166" y1="115" x2="204" y2="45"/><line x1="236" y1="45" x2="236" y2="125"/>` + arr(236, 125, 236, 160, 3) + tx(262, 150, '引く') +
    `<line x1="150" y1="131" x2="150" y2="145"/><rect x="125" y="145" width="50" height="30"/>` + tx(150, 166, '物体'));
}
function figAtwood() {
  return svg(170, `<line x1="100" y1="10" x2="220" y2="10" stroke-width="3"/><line x1="160" y1="10" x2="160" y2="40"/><circle cx="160" cy="40" r="18"/>` +
    `<line x1="142" y1="40" x2="142" y2="105"/><line x1="178" y1="40" x2="178" y2="105"/>` +
    `<rect x="120" y="105" width="44" height="40"/><rect x="164" y="105" width="38" height="34"/>` + tx(142, 131, 'A') + tx(183, 127, 'B'));
}
function figSpringH() {
  return svg(140, ground(120, 30, 305) + `<line x1="30" y1="40" x2="30" y2="120" stroke-width="3"/>` +
    Array.from({ length: 6 }, (_, i) => `<line x1="30" y1="${48 + i * 13}" x2="20" y2="${56 + i * 13}" stroke-width="1"/>`).join('') +
    zig(30, 98, 150, 98) + `<rect x="210" y="76" width="50" height="44"/>` + arr(205, 60, 160, 60, 3) + tx(183, 52, 'v₀'));
}
function figSpringV() {
  return svg(160, `<line x1="100" y1="10" x2="220" y2="10" stroke-width="3"/>` + zig(160, 10, 160, 85, 7, 9) +
    `<rect x="135" y="85" width="50" height="36"/><rect x="105" y="121" width="110" height="7"/>` + tx(160, 108, 'm') + arr(250, 60, 250, 120, 1.5) + tx(262, 95, 'x', 'start'));
}
function figPendulum(lbl, nail = false) {
  const t = Math.PI / 3, L = 110, px = 160, py = 15, bx = px + L * Math.sin(t), by = py + L * Math.cos(t);
  return svg(150, `<line x1="110" y1="${py}" x2="210" y2="${py}" stroke-width="3"/>` +
    `<line x1="${px}" y1="${py}" x2="${px}" y2="${py + L}" stroke-dasharray="5 4" stroke-width="1.5"/>` +
    `<line x1="${px}" y1="${py}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="8" fill="currentColor"/>` +
    `<circle cx="${px}" cy="${py + L}" r="8" stroke-dasharray="3 3" stroke-width="1.5"/>` +
    `<path d="M${px},${py + 35} A35,35 0 0 0 ${(px + 35 * Math.sin(t)).toFixed(1)},${(py + 35 * Math.cos(t)).toFixed(1)}" stroke-width="1.5"/>` + tx(px + 22, py + 50, lbl) + tx(px - 10, py + 4, 'O', 'end'));
}
function figLevels() {
  return svg(170, `<path d="M15,150 L120,150 L120,110 L210,110 L210,40 L305,40"/>` +
    `<path d="M20,158 q8,-5 16,0 t16,0 t16,0 t16,0 t16,0" stroke-width="1.2"/>` +
    `<rect x="150" y="92" width="30" height="18"/>` + tx(65, 140, '川の水面') + tx(165, 128, '道路') + tx(258, 32, '庭') +
    arr(100, 130, 100, 110, 1.2) + arr(100, 130, 100, 150, 1.2) + tx(95, 134, 'a', 'end') +
    arr(232, 75, 232, 40, 1.2) + arr(232, 75, 232, 110, 1.2) + tx(240, 80, 'b', 'start'));
}
function figLoop() {
  return svg(170, ground(150) + `<circle cx="130" cy="105" r="45"/><path d="M215,150 L300,60"/>` +
    `<circle cx="40" cy="142" r="7" fill="currentColor"/>` + arr(52, 128, 85, 128, 2) + tx(40, 126, 'A') +
    `<circle cx="130" cy="60" r="4" fill="currentColor"/>` + tx(130, 52, 'B') + tx(282, 70, 'C') +
    `<line x1="130" y1="60" x2="130" y2="150" stroke-dasharray="4 4" stroke-width="1"/>` + tx(118, 110, 'd', 'end'));
}
function figCurve() {
  return svg(175, ground(160) + `<path d="M25,30 C60,150 130,160 170,140 S230,100 240,95"/>` +
    `<circle cx="28" cy="38" r="6" fill="currentColor"/>` + tx(40, 30, 'A', 'start') + tx(250, 92, 'B', 'start') +
    arr(240, 95, 290, 45, 2) + tx(278, 40, '45°', 'start') +
    `<line x1="12" y1="38" x2="12" y2="160" stroke-width="1"/>` + tx(18, 100, 'h₁', 'start') +
    `<line x1="240" y1="95" x2="240" y2="160" stroke-dasharray="4 4" stroke-width="1"/>` + tx(246, 135, 'h₂', 'start'));
}
function figStrip() {
  return svg(160, `<path d="M20,30 C30,110 60,140 100,140 L220,140 C260,140 290,110 300,30"/>` +
    `<line x1="125" y1="140" x2="195" y2="140" stroke-width="7" stroke-opacity="0.35"/>` + tx(160, 158, '粗い部分 L') +
    `<circle cx="24" cy="40" r="6" fill="currentColor"/>` + tx(36, 36, 'h', 'start'));
}
function figThrow(lbl = '') {
  return svg(160, ground(150) + `<path d="M15,50 L120,50 L120,150"/><circle cx="120" cy="44" r="6" fill="currentColor"/>` +
    arr(128, 44, 175, 44, 2) + tx(185, 40, lbl || 'v₀', 'start') +
    `<line x1="135" y1="50" x2="135" y2="150" stroke-dasharray="4 4" stroke-width="1"/>` + tx(142, 105, 'H', 'start'));
}

// ==== ① 仕事と仕事の原理 ====
function u1n_angle() {
  const F = pick([10, 20, 30, 40, 50]), s = pick([2.0, 3.0, 4.0, 5.0]), th = pick([30, 60]);
  const c = th === 30 ? S3 / 2 : 0.5, sn = th === 30 ? 0.5 : S3 / 2, W = F * s * c;
  return { kind: '数値', title: '斜め向きの力がする仕事', fig: figForceAngle(th + '°'),
    text: `水平面上にある物体に，水平とのなす角が${th}°の向きに${V(F)} Nの力を加え続け，物体を水平に${V(s)} m動かした。物体はもち上がらなかったとし，\\(\\sqrt{3}=1.73\\)とする。`,
    subs: [
      numSub('この力がした仕事はいくらか。', W, 'J', [F * s, F * s * sn, F * s * c * 2],
        R`移動の向きと力のなす角が${th}°なので，\(W=Fs\cos${th}^\circ=${V(F)}\times${V(s)}\times${th === 30 ? R`\frac{1.73}{2}` : R`\frac{1}{2}`}=${fmt(W)}\ \mathrm{J}\)。移動の向きの力の成分だけが仕事をする。`),
      mk('物体が水平面から受ける垂直抗力がした仕事はいくらか。', N(0, 'J'), [N(F * s * sn, 'J'), N(-F * s * sn, 'J'), N(F * s, 'J')],
        '垂直抗力は移動の向きと垂直（なす角90°）なので，\\(W=Fs\\cos90^\\circ=0\\)。仕事をしない。')
    ] };
}
function u1n_pulley() {
  const m = pick([10, 20, 30, 40, 50]), h = pick([0.50, 1.0, 1.5, 2.0]), T = m * g / 2;
  return { kind: '数値', title: '動滑車と仕事の原理', fig: figPulley(),
    text: `図のように，定滑車と動滑車を組みあわせて，質量${V(m)} kgの物体をゆっくりと${V(h)} mの高さまで引き上げた。重力加速度の大きさを9.8 m/s²とし，滑車やひもの質量は無視できるとする。`,
    subs: [
      numSub('ひもを引く力の大きさはいくらか。', T, 'N', [m * g, m * g / 4, m / 2],
        R`動滑車と物体を一体とみると，上向きに張力 \(T\) が2本はたらくので \(2T=${V(m)}\times9.8\)，\(T=${fmt(T)}\ \mathrm{N}\)。`),
      numSub('人がひもを引いた長さはいくらか。', 2 * h, 'm', [h, h / 2, 4 * h],
        R`物体を ${V(h)} m 上げるには，動滑車の両側のひもをそれぞれ ${V(h)} m ずつ短くする必要があるので，\(2\times${V(h)}=${fmt(2 * h)}\ \mathrm{m}\)。`),
      numSub('ひもを引く力がした仕事はいくらか。', m * g * h, 'J', [m * g * h / 2, 2 * m * g * h, m * h],
        R`\(W=Fs=${fmt(T)}\times${fmt(2 * h)}=${fmt(m * g * h)}\ \mathrm{J}\)。直接もち上げる仕事 \(mgh\) と同じになる（仕事の原理）。`)
    ] };
}
function u1n_lift() {
  const m = pick([5.0, 10, 20, 25, 50]), h = pick([2.0, 3.0, 4.0, 5.0, 10]), W = m * g * h;
  return { kind: '数値', title: '一定の速さでもち上げる仕事',
    text: `質量${V(m)} kgの物体を，鉛直上向きに一定の速さで${V(h)} mもち上げる。重力加速度の大きさを9.8 m/s²とする。`,
    subs: [
      numSub('もち上げるのに必要な力の大きさはいくらか。', m * g, 'N', [m, m * g / 2, 2 * m * g],
        R`一定の速さなので力はつりあっている。\(F=mg=${V(m)}\times9.8=${fmt(m * g)}\ \mathrm{N}\)。`),
      numSub('もち上げる力がした仕事はいくらか。', W, 'J', [m * h, W / 2, -W],
        R`\(W=Fs=${fmt(m * g)}\times${V(h)}=${fmt(W)}\ \mathrm{J}\)。`),
      numSub('この間に重力が物体にした仕事はいくらか。', -W, 'J', [W, -m * h, -W / 2],
        R`重力（下向き）と移動の向き（上向き）のなす角は180°なので，\(W=mgh\cos180^\circ=-${fmt(W)}\ \mathrm{J}\)。負の仕事になる。`)
    ] };
}
function u1n_friction() {
  const m = pick([2.0, 4.0, 5.0, 10]), mu = pick([0.20, 0.25, 0.50]), s = pick([2.0, 3.0, 4.0, 5.0]), F = mu * m * g;
  return { kind: '数値', title: '動摩擦力に逆らってする仕事',
    text: `粗い水平面上で，質量${V(m)} kgの物体に水平方向の力を加え，一定の速さで${V(s)} m動かした。物体と面との間の動摩擦係数を${V(mu)}，重力加速度の大きさを9.8 m/s²とする。`,
    subs: [

function u2n_friction() {

    subs: [

    subs: [
      numSub('ブレーキをかける前の自動車の運動エネルギーはいくらか。', K, 'J', [m * v * v, 0.5 * m * v, 0.5 * m * vk * vk], R`\(K=\frac12mv^2=\frac12\times${m}\times${V(v)}^2=${fmt(K)}\ \mathrm{J}\)。`),
      numSub('動摩擦力の大きさはいくらか。', F, 'N', [2 * F, K * s, m * v / s],
        R`運動エネルギーの変化＝動摩擦力がした仕事。\(0-${fmt(K)}=-F\times${V(s)}\) より \(F=${fmt(F)}\ \mathrm{N}\)。`),
      numSub(`同じ自動車が${vk * 2} km/hで走ってきて同じように急ブレーキをかけると，停止するまでにすべる距離はいくらか。`, 4 * s, 'm', [2 * s, s, 8 * s],
        R`速さが2倍だと運動エネルギーは4倍。動摩擦力は同じなので距離も4倍：\(${fmt(4 * s)}\ \mathrm{m}\)。`)
    ] };
}
function u3n_stop() {
  let mu, a, s;
  do { mu = pick([0.20, 0.25, 0.40, 0.50]); a = pick([4, 8, 10, 12, 20]); s = a * a / (40 * mu); } while (Math.abs(Number(fmt(s)) - s) > 1e-9 || s > 60);
  const v0 = 0.7 * a, m = pick([2.0, 5.0]), f = mu * m * g;
  return { kind: '数値', title: '動摩擦力による停止',
    text: `動摩擦係数が${V(mu)}の水平な台の上で，質量${V(m)} kgの物体に${V(v0)} m/sの初速度を与えた。重力加速度の大きさを9.8 m/s²とし，エネルギーの考えを用いて答えよ。`,
    subs: [
      numSub('物体が受ける動摩擦力の大きさはいくらか。', f, 'N', [m * g, mu * m, f * 2], R`\(f=\mu' mg=${V(mu)}\times${V(m)}\times9.8=${fmt(f)}\ \mathrm{N}\)。`),
      numSub('物体が静止するまでに移動する距離はいくらか。', s, 'm', [2 * s, s / 2, v0 / (2 * mu * g)],
        R`\(0-\frac12mv_0^2=-\mu' mg\times s\) より \(s=\frac{v_0^2}{2\mu' g}=\frac{${V(v0)}^2}{2\times${V(mu)}\times9.8}=${fmt(s)}\ \mathrm{m}\)。質量は約分されて消える。`)
    ] };
}

  const n = f.mode === 'solo' ? 1 : MAX_MEMBERS, rows = f.members.slice(0, n);
  const half = rows.findIndex(m => (m.num === '') !== (m.name === ''));
  if (half >= 0) { alertBox(`${f.mode === 'solo' ? '' : (half + 1) + '人目の'}出席番号と氏名を両方入力してください。`); return; }
  const ok = rows.filter(filled);
  if (f.mode === 'solo' && ok.length < 1) { alertBox('出席番号と氏名を入力してください。'); return; }
  if (f.mode === 'group' && ok.length < MIN_GROUP) { alertBox(`PW/GWモードでは${MIN_GROUP}名以上入力してください。`); return; }
  const nums = ok.map(m => m.num);
  if (new Set(nums).size !== nums.length) { alertBox('同じ出席番号が入力されています。'); return; }
  const members = emptyMembers();
  if (f.mode === 'group') ok.forEach((m, i) => members[i] = { ...m });
  else f.members.forEach((m, i) => members[i] = { ...m });
  S.student = { mode: f.mode, cls, members };
  saveStudent(); S.editing = false; S.form = null; render();
}

// ---- 出題 ----
function selectTab(i) {
  if (S.items.length && !allDone() && S.st.some(x => x.tried.length) && !confirm('解答中の問題があります。単元を切り替えますか？（記録は送信されません）')) return;
  S.tab = i; S.items = []; S.st = []; render();
}
function renderStart() {
  const t = TABS[S.tab];
  $('app').innerHTML = `<div class="card intro"><h2 style="margin-top:0;font-size:20px">${t.no} ${t.name}</h2>
    <ul><li>1回に3題出題します（文字式の問題が1〜2題，残りは数値計算）。</li>
    <li>各問の小問は4択です。正解するまで選び直せます。</li>
    <li>はじめに選んだ答えが正解だった小問が得点になります。</li>
    <li>すべての小問に正解すると，記録が送信されます。</li></ul>
    <button class="btn pri" onclick="startQuiz()">学習を始める</button></div>`;
}
function startQuiz() {
  S.items = genSet(S.tab); S.sent = false;
  S.st = [];
  S.items.forEach((p, pi) => p.subs.forEach((s, si) => S.st.push({ pi, si, tried: [], done: false, first: null })));
  render(); window.scrollTo(0, 0);
}
const stOf = (pi, si) => S.st.find(x => x.pi === pi && x.si === si);
const allDone = () => S.st.length > 0 && S.st.every(x => x.done);
const subLabel = (pi, si, n) => `${pi + 1}` + (n > 1 ? `(${si + 1})` : '');
function renderQuiz() {
  const html = S.items.map((p, pi) => `<div class="card">
    <div class="ph"><span class="pno">第${pi + 1}問</span><span class="badge ${p.kind}">${p.kind === '文字' ? '文字式' : '数値計算'}</span><span class="ptitle">${p.title}</span></div>
    <div class="ptext">${p.text}</div>${p.fig || ''}
    ${p.subs.map((s, si) => `<div class="sub" id="sub-${pi}-${si}">${subHTML(p, pi, si)}</div>`).join('')}</div>`).join('');
  $('app').innerHTML = `<div class="progress" id="prog"></div>` + html + `<div id="result"></div>`;
  updateProgress(); typeset($('app'));
  if (allDone()) showResult();
}
function subHTML(p, pi, si) {
  const s = p.subs[si], st = stOf(pi, si), n = p.subs.length;
  const btns = s.ch.map((c, ci) => {
    const cls = st.tried.includes(ci) ? (ci === s.a ? 'ok' : 'ng') : '';
    const dis = st.done || st.tried.includes(ci) ? 'disabled' : '';
    return `<button class="ch ${cls}" ${dis} onclick="answer(${pi},${si},${ci})"><b>${'アイウエ'[ci]}</b><span>${c}</span></button>`;
  }).join('');
  let fb = '';
  if (st.done) fb = `<div class="fb"><span class="res ok">${st.first ? '◎ 正解！' : '○ 正解'}</span><div class="exp">${s.exp}</div></div>`;
  else if (st.tried.length) fb = `<div class="fb"><span class="res ng">× ちがいます。</span> もう一度考えてみよう。</div>`;
  return `<div class="sq">${n > 1 ? `(${si + 1}) ` : ''}${s.q}</div><div class="choices">${btns}</div>${fb}`;
}
function answer(pi, si, ci) {
  const st = stOf(pi, si), s = S.items[pi].subs[si];
  if (st.done || st.tried.includes(ci)) return;
  st.tried.push(ci);
  if (st.first === null) st.first = ci === s.a;
  if (ci === s.a) st.done = true;
  const el = $(`sub-${pi}-${si}`);
  el.innerHTML = subHTML(S.items[pi], pi, si); typeset(el);
  updateProgress();
  if (allDone()) showResult();
}
function updateProgress() {
  const d = S.st.filter(x => x.done).length;
  $('prog').textContent = `正解した小問：${d} / ${S.st.length}`;
}
function showResult() {
  const score = S.st.filter(x => x.first).length, N = S.st.length;
  $('result').innerHTML = `<div class="card" style="text-align:center">
    <div>はじめの解答で正解した小問</div><div class="score">${score} / ${N}</div>
    <div id="status" class="msg info">記録を送信しています…</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" onclick="startQuiz()">次の3題に挑戦</button>
    <button class="btn sec" onclick="selectTab(S.tab)">単元のはじめにもどる</button></div></div>`;
  $('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (!S.sent) { S.sent = true; sendRecord(score, N); } else setStatus('記録は送信済みです。', 'ok');
}
function setStatus(t, k = 'info') { const el = $('status'); if (el) { el.className = 'msg ' + k; el.textContent = t; } }

async function sendRecord(score, N) {
  if (!GAS_URL) { setStatus('送信先（GAS URL）が未設定のため，記録は送信されていません。', 'ng'); return; }
  const t = TABS[S.tab], st = S.student, ms = activeMembers(st);
  const groupStr = ms.map(m => `${m.num}番 ${m.name}`).join('・');
  const qids = S.st.map(x => subLabel(x.pi, x.si, S.items[x.pi].subs.length));
  const sendOne = async m => {
    const params = new URLSearchParams({
      app: APP_ID, section: `${t.no}${t.name}`, cls: st.cls, num: m.num, name: m.name,
      mode: modeLabel(st), group: st.mode === 'group' ? groupStr : '',
      score: String(score), total: String(N), qids: qids.join(','),
      labels: S.items.map(p => `${p.kind}:${p.title}`).join('|')
    });
    S.st.forEach((x, i) => params.append('q' + qids[i], x.first ? '○' : '×'));
    for (let k = 1; k <= 3; k++) {
      try { await fetch(GAS_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors', cache: 'no-store' }); return true; }
      catch (e) { if (k < 3) await new Promise(r => setTimeout(r, 1200 * k)); }
    }
    return false;
  };
  const failed = [];
  for (let i = 0; i < ms.length; i++) {
    setStatus(`記録を送信しています…${ms.length > 1 ? `（${i + 1}/${ms.length}人目）` : ''}`);
    if (!(await sendOne(ms[i]))) failed.push(ms[i]);
  }
  if (failed.length) setStatus(`送信できませんでした（${failed.map(m => m.name).join('・')}）。通信状況を確認して先生に伝えてください。`, 'ng');
  else setStatus(ms.length > 1 ? `${ms.length}人分の記録を送信しました。` : '記録を送信しました。', 'ok');
}

loadStudent();
window.addEventListener('load', () => { render(); });
</script>
